[project]
name = "pdfread"
version = "0.4.1"
description = "轻量 PDF 双栏对照翻译阅读器: 左栏原文, 右栏流式中文译文"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "fhan235" }]
keywords = ["pdf", "translation", "reader", "bilingual", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing",
]
dependencies = [
    "pymupdf>=1.24",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    # 原生窗口(pywebview 本体为纯 Python, 各平台后端按需安装)
    "pywebview>=5.0",
    "pythonnet>=3.0; sys_platform == 'win32'",
    "clr-loader>=0.2.6; sys_platform == 'win32'",
    "pyobjc-core>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-WebKit>=10.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]

[project.scripts]
pdfread = "pdfread.cli:main"

[project.gui-scripts]
pdfread-app = "pdfread.app:main"

[project.urls]
Homepage = "https://github.com/fhan235/pdfread"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdfread"]
