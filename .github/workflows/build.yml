name: build

# 推送 v* 标签时自动构建三平台产物并发布 Release
# 也可在 Actions 页面手动触发(仅构建, 不发布)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-14          # Apple Silicon
            name: macos-arm64
          - os: ubuntu-22.04
            name: linux-x64
          # 不再单独构建 Intel Mac(macos-13):
          # GitHub 的 Intel runner 资源紧张, 任务长期排队阻塞整条流水线。
          # Intel 机型可通过 Rosetta 2 运行 arm64 版本。

    runs-on: ${{ matrix.os }}
    # 避免个别 runner 资源紧张时长期占用队列
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller

      - name: Prepare macOS icon
        if: runner.os == 'macOS'
        run: bash scripts/make_macos_icon.sh

      - name: Build
        run: pyinstaller --noconfirm pdfread.spec

      # ---------- Windows: 打包成 zip ----------
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/pdfread/* `
            -DestinationPath "pdfread-${{ matrix.name }}.zip"

      # ---------- macOS: 打包成 dmg ----------
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          # 移除隔离属性, 减少首次打开的阻力
          xattr -cr "dist/pdfread.app" || true
          mkdir -p dmg && cp -R "dist/pdfread.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "pdfread" -srcfolder dmg -ov -format UDZO \
            "pdfread-${{ matrix.name }}.dmg"

      # ---------- Linux: 打包成 tar.gz ----------
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "pdfread-${{ matrix.name }}.tar.gz" -C dist pdfread

      - uses: actions/upload-artifact@v6
        with:
          name: pdfread-${{ matrix.name }}
          path: |
            pdfread-*.zip
            pdfread-*.dmg
            pdfread-*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            ## 下载

            | 系统 | 文件 |
            |---|---|
            | Windows | `pdfread-windows-x64.zip` |
            | macOS | `pdfread-macos-arm64.dmg` |
            | Linux | `pdfread-linux-x64.tar.gz` |

            > Intel 芯片的 Mac 也下载上面这个 dmg，首次打开时系统会自动通过
            > Rosetta 2 运行（若未安装会提示一键安装）。

            ## 使用

            1. 下载对应系统的文件并解压 / 安装
            2. 设置翻译服务密钥（任选其一）：
               - macOS / Linux：`export DEEPSEEK_API_KEY='sk-...'`
               - Windows：在「系统环境变量」中新增 `DEEPSEEK_API_KEY`
            3. 双击 `pdfread` 启动，浏览器会自动打开
            4. 在界面中选择或拖入 PDF

            ## 注意

            - **macOS 首次打开**：当前包未使用 Apple Developer ID 签名和 Notarization（公证），
              Gatekeeper 会提示「无法验证是否包含可能危害 Mac 安全或泄漏隐私的恶意软件」。
              请右键点击 App →「打开」→ 再次确认；这是 macOS 对未签名第三方 App 的标准提示，不代表检测到了恶意软件。
              若显示「已损坏」，在终端执行：`xattr -cr /Applications/pdfread.app`
            - **Windows**：若被 SmartScreen 拦截，点击「更多信息」→「仍要运行」。
              个别杀毒软件可能对 PyInstaller 产物误报。
