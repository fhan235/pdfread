name: build

# 推送 v* 标签时自动构建三平台产物并发布 Release
# 也可在 Actions 页面手动触发(仅构建, 不发布)
on:
  push:
    tags: ["v*"]
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-15          # Apple Silicon
            name: macos-arm64
          - os: macos-15-intel    # Intel
            name: macos-x64
          - os: ubuntu-22.04
            name: linux-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.15"

      - name: Install locked dependencies
        run: uv sync --locked --extra test --extra build

      - name: Test
        run: uv run --locked pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test frontend handlers
        run: node --test tests/test_frontend.cjs

      - name: Prepare macOS icon
        if: runner.os == 'macOS'
        run: bash scripts/make_macos_icon.sh

      - name: Build
        run: uv run --locked pyinstaller --noconfirm pdfread.spec

      # ---------- Windows: 打包成 zip ----------
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/pdfread/* `
            -DestinationPath "pdfread-${{ matrix.name }}.zip"

      # ---------- macOS: 打包成 dmg ----------
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          # 移除隔离属性, 减少首次打开的阻力
          xattr -cr "dist/pdfread.app" || true
          mkdir -p dmg && cp -R "dist/pdfread.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "pdfread" -srcfolder dmg -ov -format UDZO \
            "pdfread-${{ matrix.name }}.dmg"

      # ---------- Linux: 打包成 tar.gz ----------
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "pdfread-${{ matrix.name }}.tar.gz" -C dist pdfread

      - uses: actions/upload-artifact@v4
        with:
          name: pdfread-${{ matrix.name }}
          path: |
            pdfread-*.zip
            pdfread-*.dmg
            pdfread-*.tar.gz
          if-no-files-found: error

  release:
    permissions:
      contents: write
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            ## 下载

            | 系统 | 文件 |
            |---|---|
            | Windows | `pdfread-windows-x64.zip` |
            | macOS (Apple Silicon) | `pdfread-macos-arm64.dmg` |
            | macOS (Intel) | `pdfread-macos-x64.dmg` |
            | Linux | `pdfread-linux-x64.tar.gz` |

            ## 使用

            1. 下载对应系统的文件并解压 / 安装
            2. 双击 `pdfread` 启动，浏览器会自动打开
            3. 在右上角「设置」中选择服务、填写密钥
            4. 在界面中选择或拖入 PDF

            ## 注意

            - **macOS 首次打开**：当前包未使用 Apple Developer ID 签名和 Notarization（公证），
              Gatekeeper 会提示「无法验证是否包含可能危害 Mac 安全或泄漏隐私的恶意软件」。
              请右键点击 App →「打开」→ 再次确认；这是 macOS 对未签名第三方 App 的标准提示，不代表检测到了恶意软件。
              若显示「已损坏」，在终端执行：`xattr -cr /Applications/pdfread.app`
            - **Windows**：若被 SmartScreen 拦截，点击「更多信息」→「仍要运行」。
              个别杀毒软件可能对 PyInstaller 产物误报。
